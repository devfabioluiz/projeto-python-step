[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "projeto-python-step"
version = "1.0.0"
description = "API REST com FastAPI para o projeto final"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyjwt>=2.9.0",
    "bcrypt>=4.0.0",
    "slowapi>=0.1.9",
    "pydantic>=2.0.0",
    "psycopg2-binary>=2.9.0",
]

[project.scripts]
seed = "seed:seed"

[tool.setuptools.packages.find]
include = ["api*"]
