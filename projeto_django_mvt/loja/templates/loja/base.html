{% load static %}
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block titulo %}CMS Produtos{% endblock %}</title>

    <!-- Bootstrap CDN -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />

    <!-- Seu CSS personalizado -->
    <link rel="stylesheet" href="{% static 'css/estilo.css' %}" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="{% url 'listar_produtos' %}"
          >📦 CMS Produtos</a
        >
        <div class="navbar-nav">
          <a class="nav-link" href="{% url 'listar_produtos' %}">Produtos</a>
          <a class="nav-link" href="{% url 'criar_produto' %}">Novo</a>
        </div>
        <div class="navbar-nav ms-auto">
          {% if user.is_authenticated %}
          <span class="nav-link">{{ user.username }}</span>
          <a class="nav-link" href="{% url 'logout' %}">Sair</a>
          {% else %}
          <a class="nav-link" href="{% url 'login' %}">Entrar</a>
          {% endif %}
        </div>
      </div>
    </nav>

    <main class="container mt-4">{% block conteudo %}{% endblock %}</main>

    <footer class="bg-dark text-white text-center py-3 mt-5">
      <p>CMS Produtos &copy; 2026 — Todos os direitos reservados</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/scripts.js' %}"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
